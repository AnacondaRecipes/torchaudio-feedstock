# gpu_variant is zipped with cuda_compiler_version on win/linux so the cpu variant
# exists once per platform. The two `cuda` rows are intentional, NOT a typo: they
# pair row-wise with cuda_compiler_version [none, 12.9, 13.0]:
#   row 2 (win-64, linux-64)        -> 12.9
#   row 3 (win-64, linux-64/aarch64) -> 13.0
# linux-aarch64 builds cuda 13.0 only (CUDA 12.x needs gcc <15, aarch64 needs 15.2.0).
# osx-arm64 (no MPS backend in torchaudio) and win-arm64 (no PBP CUDA workers) are cpu only.
gpu_variant:
  - cpu                              # all platforms
  - cuda                             # [(win and x86_64) or (linux and x86_64)]
  - cuda                             # [(win and x86_64) or linux]

# Linux aarch64 needs gcc 15.2.0 due to vector-instruction bug in 14.3.
# Linux x86_64 pinned to gcc 14 for CUDA 12.x compatibility (matches
# pytorch-feedstock so libtorch ABI aligns with the pytorch on pkgs/main).
c_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]
cxx_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]

# Replaces the aggregate list (which also has 13.4 for win-arm64).
cuda_compiler_version:
  - none                             # cpu
  - 12.9                             # [(win and x86_64) or (linux and x86_64)]
  - 13.0                             # [(win and x86_64) or linux]

# Same SDK as pytorch-feedstock's osx-arm64 cpu build; the deployment target stays
# the aggregate's 12.1 (libtorch 2.15.0 osx-arm64 requires __osx >=12.1).
CONDA_BUILD_SYSROOT:         # [(osx and arm64)]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX13.3.sdk  # [(osx and arm64)]

zip_keys:                        # [win or linux]
  -                              # [win or linux]
    - gpu_variant                # [win or linux]
    - cuda_compiler_version      # [win or linux]
